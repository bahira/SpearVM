name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install numpy pytest scipy
        run: pip install numpy pytest scipy wheel

      - name: Compile noyaux (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -O3 -mavx2 -mfma -fopenmp -shared \
              -o spur_math/libspur_kernels.so src/spur_kernels.c

      - name: Compile noyaux (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          gcc -O3 -mavx2 -mfma -fopenmp -shared \
              -o spur_math/spur_kernels.dll src/spur_kernels.c
          GCCBIN=$(dirname $(which gcc))
          cp "$GCCBIN"/libgcc_s_seh-1.dll "$GCCBIN"/libwinpthread-1.dll \
             "$GCCBIN"/libgomp-1.dll spur_math/ || true

      - name: Tests noyaux + training + fp32/backprop
        env:
          PYTHONPATH: .
          OMP_WAIT_POLICY: ACTIVE
        run: pytest tests/test_correctness.py tests/test_train.py tests/test_backprop_f32.py -v

      - name: Test matmul vs BLAS
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: .
        run: python tests/bench_matmul_api.py

      - name: JIT x64 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bin
          gcc -O2 -mavx2 -mfma -static -o bin/test_encoding.exe tests/test_encoding.c
          ./bin/test_encoding.exe
          gcc -O3 -Iinclude -mavx2 -mfma -shared \
              -o spur_math/spur_jit.dll src/spur.c -lm
          gcc -O3 -Iinclude -mavx2 -mfma -shared \
              -o bin/spur.dll src/spur.c -lm
          PYTHONPATH=. python -m pytest tests/test_map.py tests/test_jit_pkg.py -v

      - name: JIT x64 (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p bin
          gcc -O2 -mavx2 -mfma -fPIC -Iinclude -shared \
              -o spur_math/spur_jit.so src/spur_posix.c -lm
          gcc -O2 -mavx2 -mfma -fPIC -Iinclude -shared \
              -o bin/spur.so src/spur_posix.c -lm
          PYTHONPATH=. python -m pytest tests/test_map.py tests/test_jit_pkg.py -v

  windows-wheel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build and validate Windows wheel
        shell: bash
        run: |
          python -m pip install build wheel numpy
          python build_package.py
          python -m wheel tags --platform-tag win_amd64 dist/spur_math-*py3-none-any.whl
          python -m pip install --force-reinstall --no-deps numpy dist/spur_math-*win_amd64.whl
          python -c "import spur_math, numpy as np; print('windows gelu ok:', spur_math.gelu(np.array([1.0])))"
      - uses: actions/upload-artifact@v6
        with:
          name: windows-wheel
          path: dist/*win_amd64.whl

  linux-wheel:
    # Build on a manylinux image so auditwheel can produce a portable tag.
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v5

      - name: Build deps
        run: |
          /opt/python/cp311-cp311/bin/python -m pip install build wheel auditwheel

      - name: Compile + package
        run: |
          gcc -O3 -mavx2 -mfma -fopenmp -fPIC -shared \
              -o spur_math/libspur_kernels.so src/spur_kernels.c -lm
          /opt/python/cp311-cp311/bin/python -m build --wheel --no-isolation

      - name: Tag and repair Linux wheel
        run: |
          mkdir -p wheelhouse
          /opt/python/cp311-cp311/bin/python -m wheel tags --platform-tag linux_x86_64 \
              dist/spur_math-*py3-none-any.whl
          /opt/python/cp311-cp311/bin/auditwheel repair \
              dist/spur_math-*linux_x86_64.whl --wheel-dir wheelhouse
          /opt/python/cp311-cp311/bin/auditwheel show wheelhouse/*.whl

      - name: Smoke test repaired wheel
        run: |
          /opt/python/cp311-cp311/bin/python -m pip install --force-reinstall numpy wheelhouse/*.whl
          /opt/python/cp311-cp311/bin/python -c "import spur_math, numpy as np; print('gelu ok:', spur_math.gelu(np.array([1.0])))"

      - uses: actions/upload-artifact@v6
        with:
          name: manylinux-wheel
          path: wheelhouse/*.whl

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Static security audit
        run: |
          pip install bandit
          bandit -r web/server/spearvm_sim -ll
