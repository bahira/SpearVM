services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spearvm
      POSTGRES_USER: spearvm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spearvm -d spearvm"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${SPEARVM_PORT:-8000}:8000"
    environment:
      SPEARVM_HOST: 0.0.0.0
      SPEARVM_PORT: 8000
      SPEARVM_AUTH_REQUIRED: "1"
      SPEARVM_CORS: ${SPEARVM_CORS:-http://localhost:5173}
      SPEARVM_MAX_CLIENTS: ${SPEARVM_MAX_CLIENTS:-8}
      SPEARVM_MAX_CLIENTS_PER_TENANT: ${SPEARVM_MAX_CLIENTS_PER_TENANT:-4}
      SPEARVM_RATE_LIMIT_PER_MINUTE: ${SPEARVM_RATE_LIMIT_PER_MINUTE:-120}
      DATABASE_URL: postgresql://spearvm:${POSTGRES_PASSWORD}@postgres:5432/spearvm
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
